<style>
/* Layout: clean white header with green tabs, white cards on a faint green-white ground. Green is the accent; yellow and pink only as small status touches. */
:root{
  --bg:#F7FAF8; --surface:#FFFFFF; --sunk:#EFF5F1; --ink:#14251C; --muted:#5D7065; --line:#E2EBE5;
  --green:#0E7A43; --green-deep:#0B5C33; --on-green:#FFFFFF; --green-soft:#E4F4EA; --head-bg:#FFFFFF; --head-fg:#14251C; --head-muted:#5D7065;
  --yellow:#FFC72C; --on-yellow:#2B2000; --yellow-soft:#FFF6D6; --yellow-text:#7A5800;
  --pink:#E23D86; --on-pink:#FFFFFF; --pink-soft:#FDEBF3; --pink-text:#B0236A;
  --ok:#137A42; --ok-bg:#E2F4E9; --warn:#955800; --warn-bg:#FDF1D6; --bad:#BF2530; --bad-bg:#FCE7E8; --info:var(--pink-text); --info-bg:var(--pink-soft); --idle:#5D7065; --idle-bg:#EEF2EF;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif; --body:"Inter",ui-sans-serif,system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B110E; --surface:#131B17; --sunk:#1A2520; --ink:#E6EEE9; --muted:#93A69B; --line:#26332C;
  --green:#3DBE77; --green-deep:#0B5C33; --on-green:#04140B; --green-soft:#16301F; --head-bg:#131B17; --head-fg:#E6EEE9; --head-muted:#93A69B;
  --yellow:#FFC72C; --on-yellow:#2B2000; --yellow-soft:#342A0A; --yellow-text:#FFD65C;
  --pink:#F0609E; --on-pink:#2A0716; --pink-soft:#36142A; --pink-text:#F58AB9;
  --ok:#55D18C; --ok-bg:#16301F; --warn:#F5B94E; --warn-bg:#33260B; --bad:#F27676; --bad-bg:#381617; --idle:#9DAFA4; --idle-bg:#1E2A24; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B110E; --surface:#131B17; --sunk:#1A2520; --ink:#E6EEE9; --muted:#93A69B; --line:#26332C;
  --green:#3DBE77; --green-deep:#0B5C33; --on-green:#04140B; --green-soft:#16301F; --head-bg:#131B17; --head-fg:#E6EEE9; --head-muted:#93A69B;
  --yellow:#FFC72C; --on-yellow:#2B2000; --yellow-soft:#342A0A; --yellow-text:#FFD65C;
  --pink:#F0609E; --on-pink:#2A0716; --pink-soft:#36142A; --pink-text:#F58AB9;
  --ok:#55D18C; --ok-bg:#16301F; --warn:#F5B94E; --warn-bg:#33260B; --bad:#F27676; --bad-bg:#381617; --idle:#9DAFA4; --idle-bg:#1E2A24; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head-bg)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--head-bg);color:var(--head-fg);border-bottom:1px solid var(--line);box-shadow:0 1px 8px rgba(14,122,67,.06)}
.top .bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:12px 6px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em;line-height:1.1}
.brand .hex{width:30px;height:30px;background:var(--green);color:var(--on-green);display:grid;place-items:center;clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%);font-size:12px}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:11px;color:var(--head-muted);letter-spacing:.02em}
.me{margin-left:auto;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;color:var(--head-fg)}
.me:hover{background:var(--sunk)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.me .nm{font-weight:600;font-size:13px;line-height:1.15;text-align:left}
.me .nm small{display:block;font-weight:500;font-size:11px;color:var(--head-muted)}
.sync{font-size:11px;color:var(--head-muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:#7C8F84;display:inline-block}
.sync.live i{background:var(--green)}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 12px 9px;font-weight:600;color:var(--head-muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--head-fg)}
.tabs button[aria-current="page"]{color:var(--green);border-bottom-color:var(--green)}
.tabs .count{font-size:11px;background:var(--sunk);border-radius:999px;padding:1px 7px;margin-left:6px}
.tabs button[aria-current="page"] .count{background:var(--green);color:var(--on-green)}
.preview{background:var(--yellow-soft);color:var(--yellow-text);border-bottom:1px solid var(--line)}
.preview .wrap{display:flex;gap:10px;align-items:center;justify-content:space-between;padding-block:7px;font-size:13px;font-weight:600;flex-wrap:wrap}
.preview button{border:0;background:var(--green);color:var(--on-green);border-radius:999px;padding:4px 12px;font-weight:700;font-size:12px}

main .wrap{padding-block:24px 64px;display:flex;flex-direction:column;gap:22px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head h1{font-size:28px;font-weight:800}
.head p{margin:2px 0 0;color:var(--muted)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px;border:0;text-align:left}
button.kpi:hover{background:var(--sunk)}
.kpi b{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--green)}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.bad b{color:var(--bad)} .kpi.warn b{color:var(--warn)} .kpi.ok b{color:var(--ok)} .kpi.info b{color:var(--pink-text)}

.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0;box-shadow:0 1px 3px rgba(20,37,28,.04)}
.panel>header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel>header h2{font-size:16px;font-weight:700}
.panel .body{padding:16px}
.scroll{overflow-x:auto}

table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--sunk)}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--idle-bg);color:var(--idle)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.info{background:var(--info-bg);color:var(--info)}
.pri{font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.pri.p1{border-color:var(--bad);color:var(--bad)}
.tag{font-size:12px;color:var(--green);background:var(--green-soft);border-radius:6px;padding:1px 7px;white-space:nowrap;font-weight:500}
.self{font-size:11px;font-weight:700;color:var(--yellow-text);background:var(--yellow-soft);border-radius:4px;padding:1px 6px;white-space:nowrap}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--on-green)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 9px;font-size:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select,.filters input,.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0;max-width:100%}
.filters input{width:200px}
.filters input[type=checkbox],.filters input[type=radio]{width:auto;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px;font-weight:600;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--on-green)}

.items{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;padding:11px 16px;border:0;border-bottom:1px solid var(--line);align-items:start;text-align:left;background:transparent;width:100%}
.item:last-child{border-bottom:0}
.item:hover{background:var(--sunk)}
.item .t{font-weight:600}
.item .meta{grid-column:2/4;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.stripe{width:4px;align-self:stretch;border-radius:4px;background:var(--idle)}
.stripe.bad{background:var(--bad)} .stripe.warn{background:var(--warn)} .stripe.ok{background:var(--ok)} .stripe.info{background:var(--pink)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:150px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:14px;background:var(--sunk);border-radius:4px;display:flex;overflow:hidden}
.bar .seg-a{background:var(--green)} .bar .seg-b{background:var(--bad)}
.bar .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col h3{font-family:var(--body);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;padding:2px 4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.card:hover{border-color:var(--green)}
.card .t{font-weight:600;line-height:1.35}
.card .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}

.mytasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:14px}
.mtask{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;border-top:3px solid var(--green);box-shadow:0 1px 3px rgba(20,37,28,.04)}
.mtask.bad{border-top-color:var(--bad)} .mtask.warn{border-top-color:var(--warn)} .mtask.info{border-top-color:var(--pink)} .mtask.ok{border-top-color:var(--ok)}
.mtask h3{font-family:var(--body);font-size:15px;font-weight:600}
.mtask .brief{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mtask .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.rowline{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px}

.scrim{position:fixed;inset:0;background:rgba(4,20,12,.5);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--surface);z-index:21;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.25);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer>header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.drawer>header h2{font-size:20px}
.drawer .content{overflow-y:auto;padding:18px 20px 28px;display:flex;flex-direction:column;gap:18px;flex:1}
.drawer .content>*{flex-shrink:0}
.drawer>footer{border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:520px){.form{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field textarea{min-height:76px;resize:vertical}
.field .ro{padding:7px 0;min-height:36px;overflow-wrap:anywhere}
.section-title{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--green);font-weight:700;border-top:1px solid var(--line);padding-top:14px}
.log{display:flex;flex-direction:column;gap:8px;font-size:13px}
.log div{display:grid;grid-template-columns:86px minmax(0,1fr);gap:8px}
.flow{display:flex;gap:4px;flex-wrap:wrap}
.flow span{font-size:11px;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);font-weight:600}
.flow span.on{background:var(--green);color:var(--on-green)}
.flow span.past{color:var(--ok)}
.flow span.stop{background:var(--bad);color:var(--on-pink)}
.notice{background:var(--pink-soft);color:var(--pink-text);border-radius:8px;padding:10px 12px;font-size:13px}
.notice.warn{background:var(--warn-bg);color:var(--warn)}
.notice.green{background:var(--green-soft);color:var(--green)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--green);color:var(--on-green);padding:10px 16px;border-radius:8px;z-index:30;font-weight:600;font-size:13px;max-width:calc(100% - 32px)}
.access td select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px}

.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.calendar .d{background:var(--surface);min-height:92px;padding:6px;display:flex;flex-direction:column;gap:4px;font-size:11px;min-width:0}
.calendar .d.out{background:var(--sunk)}
.calendar .d.today{box-shadow:inset 0 0 0 2px var(--green)}
.calendar .dn{font-weight:700;color:var(--muted)}
.calendar .dh{background:var(--sunk);padding:6px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.pp{border-radius:4px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--idle-bg);color:var(--idle);border:0;text-align:left;font-size:11px;font-weight:600}
.pp.ok{background:var(--ok-bg);color:var(--ok)} .pp.warn{background:var(--warn-bg);color:var(--warn)} .pp.info{background:var(--info-bg);color:var(--info)} .pp.bad{background:var(--bad-bg);color:var(--bad)}

.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:10px}
.pick button{display:flex;gap:10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.pick button:hover{border-color:var(--green);background:var(--green-soft)}
.pick b{display:block;font-weight:600}
.pick small{color:var(--muted);font-size:12px}
.pickgroup h3{font-family:var(--body);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 0 10px}

.roles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:820px){.roles3{grid-template-columns:minmax(0,1fr)}}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.rcard .badge{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 10px}
.rcard h3{font-size:19px}
.rcard ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;color:var(--muted)}
.b-green{background:var(--green);color:var(--on-green)} .b-yellow{background:var(--green-soft);color:var(--green)} .b-pink{background:var(--green-soft);color:var(--green)}
.journey{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:900px){.journey{grid-template-columns:minmax(0,1fr)}}
.stage{padding:14px 16px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:6px;min-width:0}
.stage+.stage{border-left:0}
.stage:first-child{border-radius:var(--r) 0 0 var(--r)} .stage:last-child{border-radius:0 var(--r) var(--r) 0}
@media (max-width:900px){.stage+.stage{border-left:1px solid var(--line);border-top:0}.stage:first-child{border-radius:var(--r) var(--r) 0 0}.stage:last-child{border-radius:0 0 var(--r) var(--r)}}
.stage .no{font-family:var(--display);font-weight:800;font-size:13px;color:var(--green);display:flex;align-items:center;gap:8px}
.stage .no i{width:22px;height:22px;border-radius:50%;background:var(--green-soft);display:grid;place-items:center;font-style:normal}
.stage h3{font-size:16px}
.stage .who{font-size:12px;font-weight:700;color:var(--green)}
.stage p{margin:0;font-size:13px;color:var(--muted)}
.stage .press{font-size:12px;font-weight:600;background:var(--yellow-soft);color:var(--yellow-text);border-radius:6px;padding:3px 8px;align-self:flex-start}
.stage.here{background:var(--green-soft);border-color:var(--green)}
.stage.here .no i{background:var(--green);color:var(--on-green)}
.stage.past .no i{background:var(--ok);color:var(--on-green)}
.loops{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:12px}
.loop{border:1px dashed var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.loop b{color:var(--green)}
.hub{display:grid;grid-template-columns:minmax(0,.8fr) auto minmax(0,1fr) auto minmax(0,1.4fr);gap:12px;align-items:center}
@media (max-width:900px){.hub{grid-template-columns:minmax(0,1fr)}.hub .arrow{transform:rotate(90deg);justify-self:center}}
.node{border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}

<script>
(() => {
const STATUSES=["Requested","In progress","Internal review","Client approval","Done","Blocked","On hold"];
const FLOW=["Requested","In progress","Internal review","Client approval","Done"];
const DEPTS=["Social Media","Design","Video Editing","Production","Performance Marketing","SEO","Website","Influencer Marketing"];
const TYPES=["Static","Carousel","Reel","Story","Motion","Banner / ad creative","Calendar","Caption / copy","Shoot","Campaign set-up","Optimisation","Report","Keyword / on-page","Technical fix","Blog / page","Website build","Website change","Bug fix","Creator campaign","Internal / admin","Other"];
const PRIS=["P1 - today","P2 - this week","P3 - planned"];
const POST_STATUSES=["Planned","In design","Internal review","Client approval","Scheduled","Published"];
const DEPT_FIELD={"Design":"designer","Video Editing":"designer","Social Media":"am","Production":"prod","Performance Marketing":"pm","SEO":"seo","Website":"web","Influencer Marketing":"inf"};
const HOME_DEPT={"Creative":"Design","Production":"Production","Performance Marketing":"Performance Marketing","SEO":"SEO","Website":"Website","Influencer Marketing":"Influencer Marketing","Account Management":"Social Media","Operations":"Social Media"};
const PREFIX={"Nikita":"NK","Kritika":"KR","Vanshita Sharma":"VS","Gunjan":"GJ","Khushi Saraswat":"KS","Sohan Rodrick":"SR","Priyanka Basu":"PB","Vineet Kumar":"VK"};
const DEPT_PREFIX={"Performance Marketing":"PM","SEO":"SEO","Website":"WEB","Influencer Marketing":"INF"};
const NON_DELIVERY=["HR","Finance","Business Development","Leadership","Client","Founder's Office"];
const DEPT_LIST=["Leadership","Founder's Office","Operations","Account Management","Creative","Production","Performance Marketing","SEO","Website","Influencer Marketing","Business Development","HR","Finance"];
const ROLE_LABEL={ceo:"CEO · Admin",ops:"Operations",manager:"Account Manager",employee:"Employee",hr:"HR",finance:"Finance",client:"Client"};
const STAFF_ROLES=["ceo","ops","manager","employee"];
const INTERNAL="Internal (At Buzz team)";

const S={feedback:[],slots:[],notes:[],noteSel:null,noteEdit:null,noteF:"all",noteQ:"",calBlocks:[],sched:"me",schedDay:null,sops:[],sopAcks:[],workUpdates:[],appSettings:[],tasks:[],posts:[],team:[],allPeople:[],former:[],clients:[],results:{},reports:[],checks:[],leaves:[],leads:[],kras:[],workdays:[],bills:[],kraReviews:[],forms:[],links:[],clientTeam:[],offices:[],live:false,loaded:{},
  me:null,realMe:null,session:null,authView:"login",isOwner:false,identityKnown:false,tab:null,filters:{q:"",dept:"",status:"open",owner:"",client:""},workMode:"list",month:todayISO().slice(0,7),drawer:null,canWrite:true,follow:"NK-002",mapClient:"Safco"};
let sb=null,db=null;
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
const addDays=(iso,n)=>{const d=new Date(iso+"T00:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmtD=iso=>{if(!iso)return"—";const d=new Date(String(iso).slice(0,10)+"T00:00:00");return isNaN(d)?String(iso):d.toLocaleDateString("en-IN",{day:"numeric",month:"short"})};
const inr=n=>n==null||n===""?"—":"₹"+Math.round(n).toLocaleString("en-IN");
const store=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}};
const initials=n=>String(n||"").split(/\s+/).filter(w=>/^[A-Za-z]/.test(w)).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const first=n=>String(n||"").split(" ")[0];

/* ---------- derived ---------- */
// Work that sits idle with no update for 4+ days turns red and notifies the owner, the CEO and Operations.
const STALE_DAYS=4;
const idleDays=t=>{const last=t.updatedAt||t.raised;if(!last)return 0;return Math.max(0,Math.floor((Date.now()-new Date(String(last).length<=10?last+"T00:00:00":last))/864e5))};
const daysUntil=d=>Math.round((new Date(d+"T00:00:00")-new Date(todayISO()+"T00:00:00"))/864e5);
function flag(t){
  const s=t.status,today=todayISO();
  if(s==="Done")return{k:"Done",c:"ok"};
  const idle=idleDays(t),stuck=idle>=STALE_DAYS;
  if(s==="Blocked")return{k:"Blocked",c:"bad",chase:true,stale:stuck};
  if(s==="On hold")return{k:"On hold",c:""};
  if(s==="Client approval")return{k:"With client",c:"info"};
  if(t.due&&t.due<today)return{k:stuck?`Overdue · no update ${idle}d`:"Overdue",c:"bad",chase:true,stale:stuck};
  if(idle>=STALE_DAYS)return{k:`No update for ${idle} days`,c:"bad",chase:true,stale:true};
  if(!t.due)return{k:"No due date",c:"warn"};
  if(t.due<=addDays(today,2))return{k:"Due soon",c:"warn",chase:true};
  return{k:"On track",c:""};
}
const isOpen=t=>t.status!=="Done";
const statusChip=s=>{const c={"Done":"ok","Blocked":"bad","Client approval":"info","Internal review":"warn"}[s]||"";return`<span class="chip ${c}">${esc(s)}</span>`};
const flagChip=t=>{const f=flag(t);return`<span class="chip ${f.c}">${esc(f.k)}</span>`};
const postClass=p=>({"Published":"ok","Scheduled":"ok","Client approval":"info","Internal review":"warn"}[p.status]||"");
const doneThisWeek=t=>t.status==="Done"&&t.doneOn&&t.doneOn>=addDays(todayISO(),-6);
const person=n=>S.team.find(p=>p.name===n);
const deliveryTeam=()=>S.team.filter(p=>!NON_DELIVERY.includes(p.dept));
const selfRaised=t=>!!t.raisedBy&&t.raisedBy===t.owner;
function roleOf(n){const r=person(n)?.role;return r==="ceo"?"ceo":r==="client"?"client":r==="hr"?"hr":r==="finance"?"finance":(r==="ops"||r==="manager")?"manager":"employee"}
const staffCount=()=>S.team.filter(p=>p.role!=="client").length;
const isOps=n=>person(n)?.role==="ops";
const isFO=n=>person(n)?.dept==="Founder's Office";
const roleLabel=p=>p?.dept==="Founder's Office"&&p.role!=="ceo"?"Founder's Office":ROLE_LABEL[p?.role]||"";
const role=()=>roleOf(S.me);
function reportsTree(name){const out=new Set([name]);let grew=true;while(grew){grew=false;for(const p of S.team){if(out.has(p.reportsTo)&&!out.has(p.name)){out.add(p.name);grew=true}}}return out}
const TEAM_ROLES=[["am","Account Manager"],["designer","Designer"],["video","Video editor"],["pm","Performance Marketing"],["seo","SEO"],["web","Website"],["inf","Influencer"],["prod","Production"]];
const extrasOf=(client,role)=>(S.clientTeam||[]).filter(t=>t.client===client&&(!role||t.role===role)).map(t=>t.person);
const isAmOf=(c,name)=>!!name&&(c.am===name||c.backupAm===name||extrasOf(c.name,"am").includes(name));
const clientsOf=name=>S.clients.filter(c=>c.am===name||extrasOf(c.name,"am").includes(name)).map(c=>c.name);
const clientsMappedTo=name=>S.clients.filter(c=>["am","designer","designer2","pm","seo","web","inf","prod","backupAm"].some(k=>c[k]===name)||extrasOf(c.name).includes(name)).map(c=>c.name);
function managerScope(name){
  if(isOps(name))return{all:true,tasks:S.tasks,posts:S.posts,people:deliveryTeam(),clients:S.clients.map(c=>c.name)};
  const tree=reportsTree(name),cl=new Set(clientsOf(name));
  const tasks=S.tasks.filter(t=>t.am===name||t.raisedBy===name||tree.has(t.owner)||cl.has(t.client));

  TABLES.forEach(t=>channel.on("postgres_changes",{event:"*",schema:"public",table:t},p=>{lastSync=Date.now();onLive(t,p)}));
  channel.on("postgres_changes",{event:"INSERT",schema:"public",table:"chat_messages"},p=>onChatMessage(p.new));
  channel.subscribe(st=>{
    if(st==="SUBSCRIBED"){if(liveRetry>0){catchUp();loadChat()}liveRetry=0;setSync("Live",true)}
    else if(st==="CHANNEL_ERROR"||st==="TIMED_OUT"||st==="CLOSED"){
      if(!started)return;

function applyFilters(tasks){
  const f=S.filters,q=f.q.trim().toLowerCase();
  return tasks.filter(t=>{
    if(q&&!`${t.id} ${t.title} ${t.client} ${t.owner} ${t.brief}`.toLowerCase().includes(q))return false;
    if(f.dept&&t.dept!==f.dept)return false;
    if(f.owner&&t.owner!==f.owner)return false;
    if(f.client&&t.client!==f.client)return false;
    const fl=flag(t).k;
    switch(f.status){
      case"open":return isOpen(t);case"idle":return isOpen(t)&&!!flag(t).stale;case"overdue":return fl.startsWith("Overdue");case"blocked":return t.status==="Blocked";case"soon":return fl==="Due soon";case"client":return t.status==="Client approval";case"done":return doneThisWeek(t);case"self":return selfRaised(t);case"all":return true;
      default:return f.status.startsWith("s:")?t.status===f.status.slice(2):true;
    }
  });
}

/* ===== Timeline (Gantt-style): each task from the day it was raised to its due date ===== */
const TL_DAYS=35;
// Only project-type work goes on the timeline; day-to-day posts don't need one.
const PROJECT_TYPES=["Website build","Shoot","Campaign set-up","Creator campaign"];
const isProjectTask=t=>PROJECT_TYPES.includes(t.type)||/onboard|launch|website|campaign|shoot|hand-over|handover|rebrand/i.test(t.title||"")||(!!t.due&&!!t.raised&&(new Date(t.due)-new Date(String(t.raised).slice(0,10)))/864e5>=7);
function timelineHTML(list,dayToDay){
  const today=todayISO(),start=S.tlStart||addDays(weekStartOf(today),-7),end=addDays(start,TL_DAYS),by=S.tlGroup||"client";
  const di=d=>Math.round((new Date(d+"T00:00:00Z")-new Date(start+"T00:00:00Z"))/864e5);
  const pct=i=>Math.max(0,Math.min(TL_DAYS,i))/TL_DAYS*100;
  const rows=list.map(t=>{let a=String(t.raised||t.due||today).slice(0,10),e=t.status==="Done"?String(t.doneOn||t.due||a).slice(0,10):String(t.due||a).slice(0,10);if(e<a)[a,e]=[e,a];
      const late=isOpen(t)&&t.due&&t.due<today;return{t,a,e,late,last:late?today:e}})
    .filter(x=>x.last>=start&&x.a<end);
  const hidden=list.length-rows.length;
  const groups={};rows.forEach(x=>{const k=(by==="client"?x.t.client:x.t.owner)||(by==="client"?"No brand":"Unassigned");(groups[k]=groups[k]||[]).push(x)});
  const keys=Object.keys(groups).sort((a,b)=>{const lateA=groups[a].some(x=>x.late),lateB=groups[b].some(x=>x.late);return(lateB-lateA)||a.localeCompare(b)});
  const cls=t=>{const c=flag(t).c;return t.status==="Done"?"done":t.status==="Blocked"?"blocked":c==="bad"?"bad":c==="warn"?"warn":c==="info"?"client":"ok"};
  const weeks=[...Array(Math.ceil(TL_DAYS/7))].map((_,i)=>addDays(start,i*7));
  const scale=`<div class="tl-row tl-scale"><div class="tl-lab"></div><div class="tl-track">${weeks.map(w=>`<span class="tl-wk" style="left:${pct(di(w))}%">${new Date(w+"T00:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short"})}</span>`).join("")}${today>=start&&today<end?`<span class="tl-todaylab" style="left:${pct(di(today)+.5)}%">Today</span>`:""}</div></div>`;
  const sundays=[...Array(TL_DAYS)].map((_,i)=>addDays(start,i)).filter(d=>new Date(d+"T00:00:00Z").getUTCDay()===0).map(d=>`<i class="tl-sun" style="left:${pct(di(d))}%;width:${100/TL_DAYS}%"></i>`).join("");
  const todayLine=today>=start&&today<end?`<i class="tl-today" style="left:${pct(di(today)+.5)}%"></i>`:"";
  const body=keys.map(k=>{const g=groups[k].sort((x,y)=>x.a.localeCompare(y.a)||x.e.localeCompare(y.e)),late=g.filter(x=>x.late).length;
    return`<div class="tl-group"><div class="tl-gh"><b>${esc(k)}</b><span class="muted">${g.length} task${g.length>1?"s":""}${late?` · <span style="color:var(--bad);font-weight:600">${late} overdue</span>`:""}</span></div>
    ${g.map(x=>{const l=pct(di(x.a)),r=pct(di(x.e)+1),w=Math.max(r-l,100/TL_DAYS*.6),tail=x.late?`<i class="tl-tail" style="left:${pct(di(x.e)+1)}%;width:${Math.max(0,pct(di(today)+1)-pct(di(x.e)+1))}%" title="Overdue since ${esc(fmtD(x.t.due))}"></i>`:"";
      return`<div class="tl-row"><button class="tl-lab" data-task="${esc(x.t._id)}"><span>${esc(x.t.title)}</span><small>${by==="client"?esc(x.t.owner||"Unassigned"):esc(x.t.client||"")} · ${esc(x.t.status)}</small></button><div class="tl-track">${sundays}${todayLine}${tail}<button class="tl-bar ${cls(x.t)}" data-task="${esc(x.t._id)}" style="left:${l}%;width:calc(${w}% - 2px)" title="${esc(x.t.title)} · ${esc(fmtD(x.a))} → ${esc(fmtD(x.e))} · ${esc(flag(x.t).k)}"><span>${esc(x.t.title)}</span></button></div></div>`}).join("")}</div>`}).join("");
  const legend=[["ok","On track"],["warn","Due soon / no date"],["client","With client"],["bad","Overdue"],["blocked","Blocked"],["done","Done"]].map(([c,l])=>`<span><i class="tl-key ${c}"></i>${l}</span>`).join("");
  return`<div class="tl-head"><div class="filters"><div class="seg" role="group" aria-label="Group by"><button data-tlgroup="client" aria-pressed="${by==="client"}">By brand</button><button data-tlgroup="owner" aria-pressed="${by==="owner"}">By person</button></div>
    <div class="seg" role="group" aria-label="Move"><button data-tlmove="-1" aria-label="Earlier">‹</button><button data-tlmove="0">This week</button><button data-tlmove="1" aria-label="Later">›</button></div>
    <span class="muted">${esc(fmtD(start))} – ${esc(fmtD(addDays(end,-1)))}${hidden?` · ${hidden} outside these dates`:""}${dayToDay?` · ${dayToDay} day-to-day task${dayToDay>1?"s":""} left out (see List)`:""}</span></div><div class="tl-legend">${legend}</div></div>

async function saveReport(btn){
  const {client,month}=S.drawer;

  document.querySelectorAll(".drawer [data-rk]").forEach(el=>{

/* ===== HR: people performance ===== */
function perfRows(m){
  const inM=d=>d&&String(d).slice(0,7)===m;
  return deliveryTeam().filter(p=>p.role!=="client").map(p=>{
    const mine=S.tasks.filter(t=>t.owner===p.name);
    const done=mine.filter(t=>t.status==="Done"&&inM(t.doneOn));
    const onTime=done.filter(t=>t.due&&t.doneOn<=t.due).length;
    const open=mine.filter(isOpen);
    const over=open.filter(t=>flag(t).k.startsWith("Overdue")).length;
    const blk=open.filter(t=>t.status==="Blocked").length;
    const sentBack=mine.reduce((n,t)=>n+(t.log||[]).filter(l=>inM(String(l.at||""))&&/asked for changes/.test(l.text||"")).length,0);
    const revs=done.length?done.reduce((a,t)=>a+(+t.revision||0),0)/done.length:null;
    const self=mine.filter(t=>t.raisedBy===p.name&&inM(t.raised)).length;
    const last=S.tasks.flatMap(t=>(t.log||[]).filter(l=>l.by===p.name).map(l=>String(l.at||""))).sort().pop()||"";
    const rate=done.length?Math.round(onTime/done.length*100):null;
    const st=(over>=2||blk>=2||(rate!=null&&rate<60))?["Needs support","bad"]:(over||blk||(rate!=null&&rate<80)||sentBack>=3)?["Watch","warn"]:["On track","ok"];
    return{p,done,onTime,rate,open:open.length,over,blk,sentBack,revs,self,last,st};
  });
}

const DESK_DEPTS=["Design","Video Editing"];
const UNIT={"Static":1,"Story":0.5,"Carousel":2,"Reel":3,"Motion":3,"Banner / ad creative":1,"Calendar":1,"Caption / copy":0.5};
const MULTI=["Static","Story","Banner / ad creative"];
const DEFAULT_CAP=25,LEAD_DAYS=3;
const SCOPE_TYPES=["Static","Carousel","Reel","Story","Motion","Banner / ad creative"];
const isDesk=t=>DESK_DEPTS.includes(t.dept);
const isCoord=n=>person(n)?.desk==="Design";
const deskLead=()=>S.team.find(p=>p.desk==="Design"&&p.active!==false)?.name||"";
const canDesk=()=>role()==="ceo"||isOps(S.me)||isCoord(S.me);
const units=t=>{const u=UNIT[t.type]??1;return MULTI.includes(t.type)?u*Math.min(20,Math.max(1,parseInt(t.count)||1)):u};
const fmtU=n=>Math.round(n*10)/10;
const weekStart=iso=>addDays(iso,-((new Date(iso+"T00:00:00").getDay()+6)%7));
const capOf=n=>{const c=person(n)?.capacity;return c==null||c===""?DEFAULT_CAP:+c};
const onLeave=(n,d)=>S.leaves.some(l=>l.person===n&&l.fromDate<=d&&l.toDate>=d);
function workDaysOff(n,from,to){let c=0;for(let d=from;d<=to;d=addDays(d,1)){if(new Date(d+"T00:00:00").getDay()!==0&&onLeave(n,d))c++}return c}
const weekCap=(n,ws)=>fmtU(capOf(n)*(6-workDaysOff(n,ws,addDays(ws,5)))/6);
const deskTasks=()=>S.tasks.filter(isDesk);
const officeOfTask=t=>person(t.owner)?.office||S.clients.find(c=>c.name===t.client)?.office||"";
const inOffice=t=>!S.deskOffice||S.deskOffice==="all"||!officeOfTask(t)||officeOfTask(t)===S.deskOffice;
const clientInOffice=c=>!S.deskOffice||S.deskOffice==="all"||!c.office||c.office===S.deskOffice;
function designers(){return S.team.filter(p=>p.dept==="Creative"&&p.active!==false&&p.role!=="client"&&(!S.deskOffice||S.deskOffice==="all"||p.office===S.deskOffice)).sort((a,b)=>(a.office||"").localeCompare(b.office||"")||a.name.localeCompare(b.name))}
const loadOf=(n,from,to)=>fmtU(deskTasks().filter(t=>t.owner===n&&t.due&&t.due>=from&&t.due<=to&&t.status!=="On hold").reduce((s,t)=>s+units(t),0));
const loadCls=(l,c)=>c<=0?(l>0?"bad":""):l>c?"bad":l>=c*.8?"warn":"ok";
function usualDesigner(t){const c=S.clients.find(x=>x.name===t.client);if(!c)return"";return[c.designer,c.designer2].find(n=>n&&person(n)?.dept==="Creative"&&person(n)?.active!==false)||""}
const planMonth=t=>String(t.postDate||t.due||"").slice(0,7);
const priRank=t=>t.priority?.startsWith("P1")?0:t.priority?.startsWith("P2")?1:2;
const byDue=(a,b)=>(a.due||"9").localeCompare(b.due||"9")||priRank(a)-priRank(b);
function deskMonths(){const m=todayISO().slice(0,7),d=m+"-01";return[addDays(d,-1).slice(0,7),m,addDays(d,32).slice(0,7),addDays(addDays(d,32).slice(0,7)+"-01",32).slice(0,7)]}
function monthWeeks(m){const first=m+"-01",out=[];let ws=weekStart(first);while(ws.slice(0,7)<=m){const we=addDays(ws,6);out.push({ws,from:ws<first?first:ws,to:we.slice(0,7)>m?addDays(addDays(m+"-01",32).slice(0,7)+"-01",-1):we});ws=addDays(ws,7)}return out}
// Proposes a designer for each task: the client's usual designer if they have room that week, otherwise whoever has the most room.
function autoPlan(list){
  const pool=designers(),load={},key=(n,ws)=>n+"|"+ws;
  const cur=(n,ws)=>load[key(n,ws)]??(load[key(n,ws)]=loadOf(n,ws,addDays(ws,6)));
  const out=[];
  for(const t of list.slice().sort(byDue)){
    const ws=weekStart(t.due||todayISO()),u=units(t),usual=usualDesigner(t),cOff=S.clients.find(c=>c.name===t.client)?.office;
    let who=pool.find(p=>p.name===usual&&cur(p.name,ws)+u<=weekCap(p.name,ws))?.name;
    if(!who){
      const cands=pool.filter(p=>weekCap(p.name,ws)>0&&!(t.due&&onLeave(p.name,t.due)));
      const same=cands.filter(p=>!cOff||p.office===cOff);
      const pick=(same.length?same:cands).map(p=>({n:p.name,r:(cur(p.name,ws)+u)/weekCap(p.name,ws)})).sort((a,b)=>a.r-b.r)[0];
      who=pick?.n;
    }
    if(!who)continue;
    load[key(who,ws)]=cur(who,ws)+u;out.push({t,who});
  }
  return out;
}

  return`<select ${attr} aria-label="Designer for ${esc(t.id)}"><option value="">Choose…</option>${designers().map(p=>{const l=loadOf(p.name,ws,addDays(ws,6)),c=weekCap(p.name,ws),lv=t.due&&onLeave(p.name,t.due);return`<option value="${esc(p.name)}" ${p.name===usual?"selected":""}>${esc(first(p.name))} · ${fmtU(l)}/${fmtU(c)}${p.name===usual?" · usual":""}${lv?" · on leave":""}${l+units(t)>c?" · full":""}</option>`}).join("")}</select>`;
}
function vDesk(){
  const lockOffice=isCoord(S.me)&&role()==="employee";
  if(!S.deskOffice||lockOffice)S.deskOffice=isCoord(S.me)?(person(S.me)?.office||"all"):"all";
  const mode=S.deskMode||"queue",lead=deskLead();
  const offices=[...new Set(S.team.filter(p=>p.dept==="Creative").map(p=>p.office).filter(Boolean))].sort();
  const qc=deskTasks().filter(t=>t.status==="Internal review"&&!t.qcBy&&inOffice(t));
  const queue=deskTasks().filter(t=>!t.owner&&isOpen(t)&&inOffice(t));
  const modes=[["queue",`To allocate${queue.length?` (${queue.length})`:""}`],["month","Month plan"],["qc",`Quality check${qc.length?` (${qc.length})`:""}`],["team","Capacity & leave"]];
  const body={queue:deskQueue,month:deskMonth,qc:deskQC,team:deskTeam}[mode]||deskQueue;
  return`<div class="head"><div><div class="eyebrow">${lead?`Coordinator: ${esc(lead)}`:"Design &amp; video"}</div><h1>Design desk</h1><p>Account Managers send design and video requests here. ${esc(lead?first(lead):"The coordinator")} allocates them to designers by load, checks quality, then the AM approves.</p></div>
  <div class="filters"><div class="seg" role="group" aria-label="Desk view">${modes.map(([k,l])=>`<button data-deskmode="${k}" aria-pressed="${mode===k}">${l}</button>`).join("")}</div>
  ${lockOffice?`<span class="tag">${esc(S.deskOffice)} office</span>`:`<label for="desk-office" class="muted">Office</label><select id="desk-office"><option value="all" ${S.deskOffice==="all"?"selected":""}>All</option>${offices.map(o=>`<option ${o===S.deskOffice?"selected":""}>${esc(o)}</option>`).join("")}</select>`}</div></div>
  ${body(queue,qc)}`;
}
function deskQueue(queue){
  const today=todayISO(),ws=weekStart(today),we=addDays(ws,6),can=S.canWrite&&canDesk();

  return`<div class="filters" style="justify-content:flex-end"><button class="btn" data-deskcopy="today">Copy today for WhatsApp</button><button class="btn" data-deskcopy="week">Copy this week</button>${can&&list.length?`<button class="btn primary" data-deskauto="queue">Auto-allocate all ${list.length}</button>`:""}</div>
  <section class="panel"><header><h2>Waiting for a designer</h2><span class="muted">Urgent first, then by due date. Numbers show each designer's load this week / capacity</span></header>
  ${list.length?`<div class="scroll"><table><thead><tr><th>Due</th><th>Client</th><th>Piece</th><th>From</th><th>Designer</th><th></th></tr></thead><tbody>${list.map(t=>`<tr><td class="num">${fmtD(t.due)}${t.priority?.startsWith("P1")?` <span class="chip bad">Urgent</span>`:""}</td><td>${esc(t.client)}</td><td style="min-width:200px"><button class="linkbtn" data-task="${esc(t._id)}">${esc(t.title)}</button><div class="muted" style="font-size:12px">${esc(t.type||t.dept)} · ${fmtU(units(t))} unit${units(t)===1?"":"s"}</div></td><td>${esc(t.raisedBy||t.am||"")}</td><td>${can?designerSelect(t,`data-deskpick="${esc(t._id)}"`):"—"}</td><td>${can?`<button class="btn sm primary" data-deskassign="${esc(t._id)}">Assign</button>`:""}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">Nothing waiting. New design requests from Account Managers land here.</div>`}</section>
  <section class="panel"><header><h2>This week by designer</h2><span class="muted">${fmtD(ws)} to ${fmtD(we)} · open work due this week</span></header><div class="body"><div class="board">${ppl.map(p=>{
    const ts=deskTasks().filter(t=>t.owner===p.name&&isOpen(t)&&t.due&&t.due<=we).sort(byDue);
    const l=loadOf(p.name,ws,we),c=weekCap(p.name,ws);
    return`<div class="col"><h3><span>${esc(first(p.name))}${onLeave(p.name,today)?` · on leave`:""}</span><span class="chip ${loadCls(l,c)}">${fmtU(l)}/${fmtU(c)}</span></h3>${ts.map(t=>`<button class="card" data-task="${esc(t._id)}"><span class="row">${flagChip(t)}<span>${fmtD(t.due)}</span></span><span class="t">${esc(t.title)}</span><span class="row"><span>${esc(t.client)}</span><span>· ${esc(t.status)}</span></span></button>`).join("")||`<div class="muted" style="font-size:12px;padding:4px">Nothing due this week</div>`}</div>`}).join("")}</div></div></section>`;
}
function deskMonth(){
  const ms=deskMonths(),m=ms.includes(S.deskMonth)?S.deskMonth:todayISO().slice(0,7);
  const weeks=monthWeeks(m),ppl=designers(),can=S.canWrite&&canDesk();
  const inM=deskTasks().filter(t=>planMonth(t)===m&&inOffice(t));
  const un=inM.filter(t=>!t.owner&&isOpen(t));
  const gaps=calendarGaps(m);
  const cell=(n,w)=>{const l=loadOf(n,w.from,w.to),c=fmtU(weekCap(n,w.ws)*(workdays(w.from,w.to)/6));return`<td class="num"><span class="chip ${loadCls(l,c)}">${fmtU(l)} / ${fmtU(c)}</span>${workDaysOff(n,w.from,w.to)?`<div class="muted" style="font-size:11px">${workDaysOff(n,w.from,w.to)}d leave</div>`:""}</td>`};
  const over=ppl.reduce((s,p)=>s+weeks.filter(w=>loadOf(p.name,w.from,w.to)>weekCap(p.name,w.ws)*(workdays(w.from,w.to)/6)).length,0);
  const clientsUn=[...new Set(un.map(t=>t.client))].sort();
  const cl=S.clients.filter(c=>(c.status||"Active")==="Active"&&clientInOffice(c)).sort((a,b)=>a.name.localeCompare(b.name));
  const scopeTxt=c=>{const s=c.scope||{};const parts=SCOPE_TYPES.filter(k=>+s[k]).map(k=>`${s[k]} ${k.toLowerCase().replace(" / ad creative","")}`);return parts.length?parts.join(" · "):""};
  const scopeTotal=c=>SCOPE_TYPES.reduce((a,k)=>a+(+(c.scope||{})[k]||0),0);
  const canScope=c=>S.canWrite&&(role()==="ceo"||isOps(S.me)||(role()==="manager"&&(isAmOf(c,S.me))));
  return`<div class="filters" style="justify-content:space-between"><div class="filters"><label for="desk-month" class="muted">Month</label><select id="desk-month">${ms.map(x=>`<option value="${x}" ${x===m?"selected":""}>${monthName(x)}</option>`).join("")}</select></div>
  <div class="filters"><button class="btn" data-deskcopy="next">Copy next week for WhatsApp</button>${can&&gaps.length?`<button class="btn" data-deskcal="${m}">Create ${gaps.length} design task${gaps.length===1?"":"s"} from the calendar</button>`:""}${can&&un.length?`<button class="btn primary" data-deskauto="month">Auto-allocate ${un.length}</button>`:""}</div></div>
  <div class="kpis"><div class="kpi"><span>Design pieces in ${esc(monthName(m))}</span><b>${inM.length}</b></div><div class="kpi"><span>Units of work</span><b>${fmtU(inM.reduce((s,t)=>s+units(t),0))}</b></div><div class="kpi"><span>Not allocated</span><b>${un.length}</b></div><div class="kpi"><span>Calendar posts with no design task</span><b>${gaps.length}</b></div><div class="kpi"><span>Overloaded weeks</span><b>${over}</b></div></div>
  <section class="panel"><header><h2>Load by week</h2><span class="muted">Units due each week / capacity (pieces for posts in early ${esc(monthName(m).split(" ")[0])} may be due the week before). Static 1 · carousel 2 · reel 3 · story ½. Leave lowers capacity.</span></header><div class="scroll"><table><thead><tr><th>Designer</th>${weeks.map(w=>`<th class="num">${fmtD(w.from)}–${fmtD(w.to)}</th>`).join("")}<th class="num">Month</th></tr></thead><tbody>
  ${ppl.map(p=>`<tr><td><b style="font-weight:600">${esc(p.name)}</b><div class="muted" style="font-size:12px">${esc(p.office||"")}</div></td>${weeks.map(w=>cell(p.name,w)).join("")}<td class="num">${fmtU(loadOf(p.name,weeks[0].from,weeks[weeks.length-1].to))}</td></tr>`).join("")}
  <tr><td><b style="font-weight:600">Not allocated</b></td>${weeks.map(w=>{const u=fmtU(un.filter(t=>t.due>=w.from&&t.due<=w.to).reduce((s,t)=>s+units(t),0));return`<td class="num">${u?`<span class="chip warn">${u}</span>`:"—"}</td>`}).join("")}<td class="num">${fmtU(un.reduce((s,t)=>s+units(t),0))}</td></tr>
  </tbody></table></div></section>
  ${can&&un.length?`<section class="panel"><header><h2>Bulk allocate</h2><span class="muted">For example: all Godfrey statics to Akshat</span></header><div class="body"><div class="filters">
    <select id="bk-client" aria-label="Client"><option value="">All clients</option>${clientsUn.map(c=>`<option>${esc(c)}</option>`).join("")}</select>
    <select id="bk-type" aria-label="Type"><option value="">All types</option>${[...new Set(un.map(t=>t.type).filter(Boolean))].map(x=>`<option>${esc(x)}</option>`).join("")}</select>
    <select id="bk-who" aria-label="Designer"><option value="">Choose designer…</option>${ppl.map(p=>`<option value="${esc(p.name)}">${esc(p.name)}</option>`).join("")}</select>
    <button class="btn primary" data-deskbulk="${m}">Assign</button></div></div></section>`:""}
  <section class="panel"><header><h2>Client scope vs plan</h2><span class="muted">Monthly deliverables against posts in the calendar and design tasks</span></header><div class="scroll"><table><thead><tr><th>Client</th><th>AM</th><th>Monthly scope</th><th class="num">Scope</th><th class="num">In calendar</th><th class="num">Design tasks</th><th class="num">Done</th><th>Gap</th><th></th></tr></thead><tbody>
  ${cl.map(c=>{const sc=scopeTotal(c),cal=S.posts.filter(p=>p.client===c.name&&p.date?.slice(0,7)===m).length,ts=inM.filter(t=>t.client===c.name),dn=ts.filter(t=>t.status==="Done").length,gap=sc?sc-Math.max(cal,ts.length):0;
    return`<tr><td><b style="font-weight:600">${esc(c.name)}</b></td><td>${esc(c.am||"")}</td><td class="muted" style="min-width:160px">${esc(scopeTxt(c)||"Not set")}</td><td class="num">${sc||"—"}</td><td class="num">${cal}</td><td class="num">${ts.length}</td><td class="num">${dn}</td><td>${!sc?`<span class="muted">—</span>`:gap>0?`<span class="chip warn">${gap} not planned</span>`:`<span class="chip ok">Planned</span>`}</td><td>${canScope(c)?`<button class="btn sm" data-scope="${esc(c.name)}">Edit scope</button>`:""}</td></tr>`}).join("")}
  </tbody></table></div></section>`;
}
const workdays=(from,to)=>{let c=0;for(let d=from;d<=to;d=addDays(d,1))if(new Date(d+"T00:00:00").getDay()!==0)c++;return c};
function deskQC(_q,qc){

}

async function saveLead(id,btn){
  if(blockedWrite())return;
  const l=id?S.leads.find(x=>x._id===id):null;
  const f={};document.querySelectorAll(".drawer [data-lk]").forEach(el=>f[el.dataset.lk]=el.value.trim());
  f.services=[...document.querySelectorAll(".drawer [data-svc]")].filter(x=>x.checked).map(x=>x.dataset.svc).join(", ");
  if(!f.company){toast("Enter the client name");$("#ld-company").focus();return}

  btn.disabled=true;
  if(!l){
    const row={id:"W-"+Date.now().toString(36),...f,stage:"Won",wonOn:todayISO(),owner:S.me,createdBy:S.me,log:[{at:stamp(),by:S.me,text:"added this win and sent it to Operations"}]};
    const {data,error}=await sb.from("leads").insert(toRow(row)).select("*");
    if(error||!data?.length){btn.disabled=false;toast(errMsg(error,"Couldn't save"));return}
    applyRow("leads",data[0]);toast(`${f.company} sent to Operations`);
  }else{
    const patch={},changed=[];
    for(const k in f){if(String(f[k]??"")!==String(l[k]??"")){patch[k]=f[k];changed.push(k.replace(/[A-Z]/g,m=>" "+m.toLowerCase()))}}
    if(!changed.length){closeDrawer();return}
    patch.log=[...(l.log||[]),{at:stamp(),by:S.me,text:"updated "+changed.join(", ")}].slice(-60);
    const {data,error}=await sb.from("leads").update(toRow(patch)).eq("id",id).select("*");
    if(error||!data?.length){btn.disabled=false;toast(errMsg(error,"Couldn't save"));return}
    applyRow("leads",data[0]);toast("Saved");

}
async function convertLead(id,btn){

function sopHtml(text){
  const lines=String(text||"").split(/\r?\n/),out=[];let list=null;
  const inline=x=>esc(x).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
  const close=()=>{if(list){out.push(`</${list}>`);list=null}};
  for(const l of lines){const t=l.trim();
    if(!t){close();continue}
    if(t.startsWith("## ")){close();out.push(`<h3>${inline(t.slice(3))}</h3>`);continue}
    const ol=t.match(/^\d+[.)]\s+(.*)$/),ul=t.match(/^[-•*]\s+(.*)$/);
    if(ol||ul){const k=ol?"ol":"ul";if(list!==k){close();out.push(`<${k}>`);list=k}out.push(`<li>${inline((ol||ul)[1])}</li>`);continue}
    close();out.push(`<p>${inline(t)}</p>`)}
  close();return out.join("");
}

  if(Date.now()-lastInteract>10*60e3)return;                 // HQ open but nobody using it: don't count as active
  lastBeat=Date.now();
  const {error}=await sb.rpc("heartbeat");if(error){console.warn("heartbeat",error);return}
  (S.pings=S.pings||{})[S.realMe]=new Date().toISOString();
  if(person(S.realMe)?.role!=="ceo"){const {data}=await sb.from("workdays").select("*").eq("id",S.realMe+"|"+localToday(S.realMe));if(data?.[0])applyRow("workdays",data[0])}
  renderDayBox();
}
// The first login of the day is the punch-in; a short pop-up confirms the time.
async function maybeNudgeDay(){
  if(dayNudged||!usesDay()||S.me!==S.realMe)return;
  dayNudged=true;
  lastInteract=Date.now();await heartbeat();await loadPings();
  clearInterval(beatTimer);beatTimer=setInterval(()=>heartbeat(),5*60e3);
  clearInterval(pingTimer);pingTimer=setInterval(()=>{if(!document.hidden)loadPings()},2*60e3);
  setTimeout(remindersPopup,2500);clearInterval(remindTimer);remindTimer=setInterval(()=>{if(!document.hidden)remindersPopup()},30*60e3);
  clearInterval(calTimer);calTimer=setInterval(()=>{if(document.hidden)return;calReminders();postReminders();if(["calendar","today"].includes(S.tab)&&!S.drawer)renderView();if(Date.now()-calLoadedAt>5*60e3)loadCal().then(()=>{if(S.tab==="schedule"&&!S.drawer)renderView()})},60e3);setTimeout(()=>{calReminders();postReminders()},4000);
  if(person(S.realMe)?.role==="ceo")return;
  clearInterval(ciTimer);ciTimer=setInterval(()=>{if(!document.hidden){renderDayBox();maybeCheckin()}},60e3);
  const w=myDay(),key="abhq.checkin."+(S.session?.user?.email||"")+"."+todayISO();
  if(w?.startAt&&!w.endAt&&!store(key)&&!S.drawer){store(key,"1");openCheckin(w)}
}

// A light-hearted note about the last working day, shown with the punch-in.
function lastDay(){
  const today=localToday(S.realMe);
  const prev=S.workdays.filter(w=>w.person===S.realMe&&w.day<today&&w.startAt&&punchOut(w)).sort((a,b)=>String(b.day).localeCompare(a.day))[0];
  if(!prev)return{prev:null,note:"First day on HQ? Welcome aboard 🎉 Everything you need is right here."};
  const h=hoursOf(prev)||0,hh=Math.floor(h),mm=Math.round((h-hh)*60),dur=hh?`${hh}h${mm?` ${mm}m`:""}`:`${mm} min`;
  const durLong=hh?`${hh} hour${hh===1?"":"s"}${mm?` ${mm} min`:""}`:`${mm} min`;
  const when=prev.day===addDays(today,-1)?"yesterday":new Date(prev.day+"T00:00:00").toLocaleDateString("en-IN",{weekday:"long"});
  const at=istTimeText(punchOut(prev),S.realMe);
  const lines=h>=10?[`You were active for ${durLong} last time and we last saw you ${when} at ${at}. Absolute machine 🦾 Pace yourself today ☕`,`${durLong} in HQ ${when}, last seen at ${at}. That's a marathon 🏃 Water break first?`]
    :h>=6?[`You were active for ${durLong} out here. We last saw you ${when} at ${at} 👋`,`${durLong} of solid work ${when}, signing off at ${at}. Let's go again 🚀`,`Last seen ${when} at ${at} after ${durLong} in HQ. Legend behaviour 🙌`]
    :[`Quick one ${when}: ${durLong} in HQ, last seen at ${at}. Let's make today count 💪`,`We last saw you ${when} at ${at} after ${durLong}. Fresh start today ✨`];
  return{prev,when,dur,note:lines[Math.floor(Math.random()*lines.length)]};
}

function onChatMessage(row){

/* ===== No picture / video uploads: share links instead ===== */
// HQ stores links only (Drive, Canva, Dropbox, WeTransfer…). Pasting or dropping any file opens a "paste a link" box.
const MEDIA_RX=/data:(image|video|audio|application)\/[a-z0-9.+-]+;base64,/i;
const hasMedia=v=>MEDIA_RX.test(String(v||""));
let linkTarget=null;
function openLinkBox(target,why){
  linkTarget=target&&/^(INPUT|TEXTAREA)$/.test(target.tagName)&&!target.disabled?target:null;
  const prev=S.drawer;S.drawer={kind:"linkbox",prev};
  const host=document.createElement("div");host.id="linkBoxHost";
  host.innerHTML=`<div class="scrim" data-linkclose="1" style="z-index:40"></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dlb" style="width:min(460px,100%);z-index:41">
  <header><div><div class="eyebrow">Pictures and videos aren't uploaded to HQ</div><h2 id="dlb" style="margin-top:4px">Add it as a link</h2></div><button class="btn ghost" data-linkclose="1" aria-label="Close">✕</button></header>
  <div class="content">
    <div class="notice warn">${esc(why||"Files can't be uploaded here.")} Upload it to Google Drive, Canva, Dropbox or WeTransfer, set sharing to "anyone with the link", and paste the link below.</div>
    <div class="field"><label for="lb-url">Link</label><input id="lb-url" type="url" placeholder="https://drive.google.com/…"></div>
    <div class="field"><label for="lb-label">What is it? (optional)</label><input id="lb-label" placeholder="e.g. Godfrey reel v2"></div>
    ${linkTarget?"":`<p class="muted" style="margin:0;font-size:13px">Click into the field where it belongs first, then add the link there.</p>`}
  </div>
  <footer><button class="btn" data-linkclose="1">Cancel</button>${linkTarget?`<button class="btn primary" data-linkinsert="1">Add link</button>`:""}</footer></aside>`;
  document.body.appendChild(host);
  setTimeout(()=>$("#lb-url")?.focus(),30);
}
function closeLinkBox(){$("#linkBoxHost")?.remove();if(S.drawer?.kind==="linkbox")S.drawer=S.drawer.prev||null;const t=linkTarget;linkTarget=null;t?.focus()}
function insertLink(){
  const url=$("#lb-url").value.trim(),label=$("#lb-label").value.trim();
  if(!/^https?:\/\/[^\s]+\.[^\s]+/i.test(url)){toast("Paste a full link starting with https://");$("#lb-url").focus();return}
  if(hasMedia(url)){toast("That's a file, not a link. Upload it to Drive first.");return}
  const t=linkTarget,text=label?`${label}: ${url}`:url;
  if(t){
    const a=t.selectionStart??t.value.length,b=t.selectionEnd??t.value.length,before=t.value.slice(0,a),sep=t.tagName==="TEXTAREA"&&before&&!/\s$/.test(before)?" ":"";
    t.value=before+sep+text+t.value.slice(b);
    t.dispatchEvent(new Event("input",{bubbles:true}));t.dispatchEvent(new Event("change",{bubbles:true}));
  }
  closeLinkBox();toast("Link added");
}
const isFileTransfer=dt=>!!dt&&([...(dt.types||[])].includes("Files")||(dt.files&&dt.files.length>0)||[...(dt.items||[])].some(i=>i.kind==="file"));
document.addEventListener("paste",e=>{
  const dt=e.clipboardData;
  if(isFileTransfer(dt)){e.preventDefault();openLinkBox(e.target,"Pasting pictures or screenshots isn't allowed.");return}
  const txt=dt?.getData("text")||"";
  if(hasMedia(txt)){e.preventDefault();openLinkBox(e.target,"That pasted content is an embedded picture or video.")}
},true);
document.addEventListener("dragover",e=>{if(isFileTransfer(e.dataTransfer)){e.preventDefault();e.dataTransfer.dropEffect="none"}},true);
document.addEventListener("drop",e=>{if(isFileTransfer(e.dataTransfer)){e.preventDefault();e.stopPropagation();openLinkBox(e.target,"Dropping pictures or videos isn't allowed.")}},true);
document.addEventListener("click",e=>{const b=e.target.closest("[data-linkclose],[data-linkinsert]");if(!b)return;e.stopPropagation();if(b.dataset.linkinsert)insertLink();else closeLinkBox()},true);
document.addEventListener("keydown",e=>{if(!$("#linkBoxHost"))return;if(e.key==="Escape"){e.stopPropagation();closeLinkBox()}else if(e.key==="Enter"&&e.target.closest?.("#linkBoxHost")){e.preventDefault();e.stopPropagation();insertLink()}},true);

// Any change counts: a task moved, a post updated or posted, the report, Drive links or onboarding form.
function brandLastActivity(name){
  const ts=[];
  S.tasks.forEach(t=>{if(t.client===name)ts.push(t.updatedAt,t.raised)});
  S.posts.forEach(p=>{if(p.client===name)ts.push(p.updatedAt,p.postedAt,p.clientApproval,p.intApproval)});
  S.reports.forEach(r=>{if(r.client===name)ts.push(r.updatedAt)});
  (S.links||[]).forEach(l=>{if(l.client===name)ts.push(l.updatedAt)});
  (S.forms||[]).forEach(f=>{if(f.client===name)ts.push(f.updatedAt)});
  const ms=ts.filter(Boolean).map(x=>new Date(String(x).length<=10?x+"T00:00:00":x).getTime()).filter(n=>!isNaN(n));
  return ms.length?Math.max(...ms):0;
}

/* ===== How work moves ===== */
function vHow(){
  const t=S.tasks.find(x=>x.id===S.follow)||S.tasks[0];
  const fi=t?FLOW.indexOf(t.status):-1;
  const stages=[
    ["Requested","The task is added","Account Manager, a manager, or the employee for their own work","Assign a task / Add my task","Client, department, owner, due date and brief go on one card. The owner fills in from the client's team."],
    ["In progress","The owner starts","Owner: designer, editor, shoot team, SEO, ads, web or influencer","Start work","Everyone on the client can see it is being worked on."],
    ["Internal review","The owner hands in the work","Owner","Send for review","They add the output link (Canva, Drive, report). It lands in the manager's Approvals."],
    ["Client approval","The manager checks it and sends it on","Account Manager or Creative Head","Approve, send to client","Not right yet? Ask for changes. It goes back to the owner with feedback and the revision round goes up by one."],
    ["Done","The client says yes","Account Manager (or the owner, for self-added work)","Client approved / Mark done","It counts in Done this week, the owner's on-time rate and the client's monthly output."]

function suggestOwner(){
  const c=S.clients.find(x=>x.name===$("#n-client")?.value),d=$("#n-dept")?.value,h=$("#n-hint");if(!h)return;
  if(!c){h.textContent="";return}
  const who=c[DEPT_FIELD[d]];
  if(DESK_DEPTS.includes(d)&&deskLead()){$("#n-owner").value="";h.textContent=who?`· usual: ${first(who)}. Leave on Design desk or pick`:"· goes to the Design desk";return}
  if(who&&person(who)){$("#n-owner").value=who;h.textContent="· mapped for this client"}else h.textContent="";

function nextId(client,dept){
  const am=S.clients.find(c=>c.name===client)?.am;
  const raiser=person(S.me);
  let pre;
  if(DEPT_PREFIX[dept])pre=DEPT_PREFIX[dept];
  else if(PREFIX[S.me])pre=PREFIX[S.me];
  else if(raiser&&raiser.role!=="manager")pre=initials(S.me);
  else pre=PREFIX[am]||"AB";
  const n=Math.max(0,...S.tasks.filter(t=>String(t.id||"").startsWith(pre+"-")).map(t=>parseInt(String(t.id).split("-").pop())||0))+1;
  return pre+"-"+String(n).padStart(3,"0");
}

document.addEventListener("click",async e=>{
  if(e.target.closest("[data-close]")){closeDrawer();return}
  const b=e.target.closest("button,tr.click");if(!b)return;
  const d=b.dataset;
  if(d.whoami){if(S.me!==S.realMe){setMe(S.realMe);S.tab="access";render()}else openAccount();return}
  if(d.endpreview){setMe(S.realMe);S.tab="access";render();return}
  if(d.authview){S.authView=d.authview;render();return}
  if(d.signout){closeDrawer();store("abhq.preview",null);await sb.auth.signOut();S.authView="login";render();return}
  if(d.bell){openNotifs();return}
  if(d.perf){openPerf(d.perf);return}
  if(d.usefolder){const t=$("#"+d.target);if(t){t.value=d.usefolder;t.focus()}return}
  if(d.team){openTeam(d.team);return}
  if(d.teamrm){teamChange(S.drawer.client,d.teamrm,d.teamp,false);return}
  if(d.addlink){openLink(null,d.addlink);return}
  if(d.savelinks){saveLinks(d.savelinks,b);return}
  if(d.handover){openHandover();return}
  if(d.dohandover){doHandover(b);return}
  if(d.form){S.formPart=S.formPart||"client";openForm(d.form);return}
  if(d.startform){startForm(d.startform,$("#fm-client")?.value,b);return}

/* ---------- client portal ---------- */
let portalTimer=null;
// Network hiccups (Wi-Fi drop, laptop waking up, Safari pausing a tab) must not break the portal:
// retry a few times, and on a background refresh keep showing the last data.
const isNetErr=e=>/load failed|failed to fetch|networkerror|network request failed|fetch/i.test(String(e?.message||e||""));
async function portalRpc(fn,args){
  for(let i=0;i<3;i++){
    let r;try{r=await sb.rpc(fn,args)}catch(e){r={data:null,error:e}}
    if(!r.error||!isNetErr(r.error))return r;
    await new Promise(ok=>setTimeout(ok,[1500,3500,0][i]));
  }
  return{data:null,error:{message:"NETWORK"}};
}
async function loadPortal(client){
  const args=client?{p_client:client}:{};
  const {data,error}=await portalRpc("client_portal",args);
  if(error){
    if(S.portal&&error.message==="NETWORK")return false;          // keep what is on screen; next refresh will catch up
    S.portal=null;
    S.portalError=error.message==="NETWORK"?"We couldn't reach At Buzz HQ just now. Please check your internet connection and press Try again.":errMsg(error,"Couldn't load the portal.");
    return false;
  }
  const fr=await portalRpc("client_forms_for_portal",args);
  data.forms=fr.error?(S.portal?.forms||[]):(fr.data||[]);
  try{const fb=await sb.from("client_feedback").select("*").eq("client",data.client).order("created_at",{ascending:false}).limit(100);data.feedback=fb.error?(S.portal?.feedback||[]):(fb.data||[])}catch(_){data.feedback=S.portal?.feedback||[]}
  S.portal=data;S.portalError=null;return true;
}

function genPw(){

  return w[a[0]%w.length]+"-"+w[a[1]%w.length]+"-"+String(1000+a[2]%9000);
}

/* ---------- notifications ---------- */
const seenKey=()=>"abhq.seen."+(S.me||"");
function lastSeen(){return store(seenKey())||new Date(Date.now()-3*864e5).toISOString().slice(0,16).replace("T"," ")}
function notifItems(){
  const me=S.me,mgr=role()!=="employee",out=[];
  for(const t of S.tasks){
    const mine=t.owner===me,raised=t.raisedBy===me,amOf=mgr&&t.am===me,desk=isCoord(me)&&isDesk(t)&&(!t.owner||t.status==="Internal review");
    if(!mine&&!raised&&!amOf&&!desk)continue;
    for(const l of (t.log||[])){
      if(!l||l.by===me||/Imported from/.test(l.text||""))continue;
      out.push({at:String(l.at||""),by:l.by,text:l.text,t});
    }
  }
  return out.sort((a,b)=>b.at.localeCompare(a.at)).slice(0,60);
}
let lastUnread=-1;
function updateBell(){
  const seen=lastSeen(),items=notifItems(),n=items.filter(i=>i.at>seen).length;
  const c=$("#bellCount");c.hidden=!n;c.textContent=n>99?"99+":String(n);
  document.title=(n?`(${n}) `:"")+"At Buzz HQ";
  if(lastUnread>=0&&n>lastUnread&&document.hidden&&"Notification" in window&&Notification.permission==="granted"){
    const it=items[0];try{new Notification("At Buzz HQ",{body:`${it.by} ${it.text} · ${it.t.title}`})}catch(e){}
  }
  lastUnread=n;
}

    if(!name){toast("Enter their name");return}
    if(person(name)){toast("Someone with that name is already on the team");return}
    const row={id:slug(name),name,email:email||null,dept:$("#ap-dept").value,position:$("#ap-pos").value.trim()||null,office:$("#ap-office").value,reports_to:$("#ap-rep").value,role:$("#ap-role").value};
    const {error}=await sb.from("people").insert(row);
    if(error){toast(errMsg(error,"Couldn't add this person."));return}
    await loadTable("people");toast(`${name} added${email?". Press Invite to send their login.":""}`);render();
  });
});
boot();
})();
</script>
</body>
</html>
